<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard-page">

        <header class="dashboard-header">
            <p class="brand-name">JobTracker</p>
            <h1>Job Applcations</h1>

            <button type="button" id="logoutButton" class="logout-button">
                Log out
            </button>
        </header>

        <section class="dashboard-card application-form-card">

        <h2>New Application Form</h2>

        <form id = "applicationForm" class="application-form">

            <div class="form-group">
                <label for="company">Company</label>
                <input
                    type="text"
                    id="company"
                    placeholder="Enter Company name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role_title">Role Title</label>
                <input
                    type="text"
                    id="role_title"
                    placeholder="Enter Role title"
                    required
                >
            </div>

            <div class="form-group">
                <label for="status">Status</label>

                <select id="status" required>
                    <option value="">Select Status</option>
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date_applied">Date Applied</label>
                <input
                    type="date"
                    id="date_applied"
                    placeholder="Application Date"
                    required
                >
            </div>

            <div class="form-group form-group-wide">
                <label for="notes">Notes</label>
                
                <textarea
                    id="notes"
                    placeholder="Add any notes about this application"
                    rows="3"
                ></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="primary-button">
                    Add Application
                </button>

                <button 
                    type="button" 
                    id="cancelEditButton" 
                    class="secondary-button"
                    hidden
                >
                    Cancel Edit
                </button>

            </div>

        </form>

        <p id="message"></p>

        </section>

        <section class="dashboard-card application-display">
            <h2>Your Applications</h2>

            <p class="section-description">
                View and manage your saved job applications
            </p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Date Applied</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                <tbody id="applicationTableBody"></tbody>
                </table>

            </div>

        </section>

    </main>

    <!-- Modal to display full notes for an application-->
    <div id="notesModal" class="notes-modal" hidden>

        <!-- Dark background behind the modal-->
        <div class="notes-modal-overlay"></div>

        <!--main box modal-->
        <div class="notes-modal-content">

            <div class="notes-modal-header">
                <h2>Application Notes</h2>

                <!-- close the modal-->                                             <!--&times displays x-->
                <button type="button" id="closeNotesModal" class="notes-modal-close">&times</button>
            </div>

            <!--Javascrpit will insert seleted application notes right here-->
            <P id="fullNotesText" class="full-notes-text"></P>

            <button type="button" id="closeNotesButton" class="primary-button">Close</button>
        </div>
    </div> 

    <script src="js/dashboard.js"></script>
</body>
</html>
